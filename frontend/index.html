<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DebugCalc — Open-Source Debugging Playground</title>
  <meta name="description" content="DebugCalc is an open-source educational calculator project for students learning Git, HTTP APIs, and C backend debugging.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-layout">
    <!-- Header -->
    <header class="app-header">
      <div class="header-left">
        <div class="logo-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="2" width="16" height="20" rx="3"></rect>
            <line x1="8" y1="6" x2="16" y2="6"></line>
            <line x1="16" y1="14" x2="16" y2="18"></line>
            <path d="M16 10h.01"></path>
            <path d="M12 10h.01"></path>
            <path d="M8 10h.01"></path>
            <path d="M12 14h.01"></path>
            <path d="M8 14h.01"></path>
            <path d="M12 18h.01"></path>
            <path d="M8 18h.01"></path>
          </svg>
        </div>
        <div class="header-titles">
          <h1>DebugCalc</h1>
          <p class="subtitle">Open-Source Debugging Workshop</p>
        </div>
      </div>

      <!-- Backend Connection Status -->
      <div class="status-card" id="status-card">
        <div class="status-indicator">
          <span class="status-dot" id="status-dot"></span>
          <span class="status-text" id="status-text">Checking Backend...</span>
        </div>
        <div class="status-subtext" id="status-subtext">http://localhost:8080</div>
      </div>
    </header>

    <main class="calculator-container">
      <!-- Top Screen / Display Area -->
      <section class="screen-card" aria-label="Calculation Screen">
        <div class="screen-meta">
          <span class="screen-tag">Live Evaluation</span>
          <span class="screen-op-badge" id="screen-op-badge">Ready</span>
        </div>
        
        <div class="expression-display" id="display-expression" title="Expression">
          <span>0</span>
        </div>

        <div class="result-row">
          <span class="result-label">Result:</span>
          <div class="result-display" id="display-result" title="Calculation Result">
            <span>0</span>
          </div>
        </div>
      </section>

      <!-- Error Alert Area -->
      <div class="error-banner hidden" id="error-banner" role="alert">
        <div class="error-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
        </div>
        <div class="error-content">
          <div class="error-title">Backend Error</div>
          <div class="error-message" id="error-message">Something went wrong.</div>
        </div>
        <button class="error-dismiss" id="btn-error-dismiss" aria-label="Dismiss error">&times;</button>
      </div>

        </div>
</body>
</html>
